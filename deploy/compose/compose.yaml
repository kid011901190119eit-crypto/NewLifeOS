# ローカル開発用。解説は docs/learning/docker.md と docs/learning/docker-compose.md にある
name: lifeos-local

services:
  postgres:
    image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?deploy/compose/.env.example を .env に複製して値を入れる}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/compose/.env.example を .env に複製して値を入れる}
      POSTGRES_DB: ${POSTGRES_DB:?deploy/compose/.env.example を .env に複製して値を入れる}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  valkey:
    image: valkey/valkey:9.1.3@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?deploy/compose/.env.example を .env に複製して値を入れる}
    # パスワードを compose.yaml に展開させないため、コンテナの中のシェルで環境変数から読む
    command: ["sh", "-c", 'exec valkey-server --appendonly yes --requirepass "$$VALKEY_PASSWORD"']
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'valkey-cli -a "$$VALKEY_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
  valkey-data:
