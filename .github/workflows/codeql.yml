name: CodeQL

# 自分たちのコードを静的解析し、脆弱性につながる書き方を見つける。
# 解析のルール(クエリ)は CodeQL 側で増えていくので、コードが変わらなくても毎週実行する。
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 15 * * 0" # 月曜 0:00(日本時間)

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    # ジョブ名は必須チェックの名前になる。変えるときはルールセットも直す
    name: codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # 結果を Security タブに登録する
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # JavaScript/TypeScript はビルドせずに解析できる(build-mode: none)
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript
